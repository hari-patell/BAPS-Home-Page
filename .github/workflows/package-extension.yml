name: Package extension

# Bundles the extension/ folder into a single downloadable zip.
# - On a published Release: attaches the zip to that release (the easy
#   "download one file" path for users).
# - On manual dispatch: uploads the zip as a workflow artifact you can grab
#   from the Actions run, without cutting a release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the extension
        run: |
          cd extension
          zip -r ../baps-daily-darshan-extension.zip . -x '*.DS_Store'

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: baps-daily-darshan-extension
          path: baps-daily-darshan-extension.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            baps-daily-darshan-extension.zip --clobber
